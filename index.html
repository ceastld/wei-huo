<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14080a" />
  <title>尾火</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540">尾火需要画布</canvas>
    <header class="hud">
      <div class="hud-brand">
        <h1>尾火</h1>
        <p class="hint" id="hint">跑过的路两秒后会爆</p>
      </div>
      <div class="hud-status">
        <span id="hearts">心×3</span>
        <span id="roomName">空场 · 1/47</span>
        <span id="combo"></span>
        <span id="seed"></span>
        <span id="haste"></span>
        <span id="echo"></span>
        <span id="suck"></span>
        <span id="dashboom"></span>
        <span id="split"></span>
        <span id="pierce"></span>
        <span id="halo"></span>
        <span id="frost"></span>
        <span id="shove"></span>
        <span id="bait"></span>
        <span id="bolt"></span>
        <span id="trip"></span>
        <span id="delay"></span>
        <span id="bounce"></span>
        <span id="roll"></span>
        <span id="mirror"></span>
        <span id="spin"></span>
        <span id="pool"></span>
        <span id="fan"></span>
        <span id="drum"></span>
        <span id="pulse"></span>
        <span id="rain"></span>
        <span id="spring"></span>
        <span id="wave"></span>
        <span id="star"></span>
        <span id="cross"></span>
        <span id="frame"></span>
        <span id="coil"></span>
        <span class="keys">WASD 移动 · G 观摩 · 空格冲刺 · R 重开本房 · Shift+R 回空场</span>
      </div>
    </header>
    <div id="overlay" class="overlay">
      <button id="watchBtn" type="button" aria-pressed="false">观摩</button>
      <p id="toast" class="toast" hidden></p>
    </div>
    <div id="touch" class="touch" hidden>
      <div id="stick" class="stick" aria-label="摇杆">
        <div id="knob" class="knob"></div>
      </div>
      <button id="dashBtn" type="button">冲</button>
    </div>
  </div>
  <script src="js/rooms.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
