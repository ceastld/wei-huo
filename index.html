<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14080a" />
  <title>尾火</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540">尾火需要画布</canvas>
    <header class="hud">
      <div class="hud-brand">
        <h1>尾火</h1>
        <p class="hint" id="hint">跑过的路两秒后会爆</p>
      </div>
      <div class="hud-status">
        <span id="hearts">心×3</span>
        <span id="roomName">空场 · 一/八</span>
        <span class="keys">WASD 移动 · 空格冲刺 · R 重开本房</span>
      </div>
    </header>
    <div id="overlay" class="overlay">
      <p id="toast" class="toast" hidden></p>
    </div>
    <div id="touch" class="touch" hidden>
      <div id="stick" class="stick" aria-label="摇杆">
        <div id="knob" class="knob"></div>
      </div>
      <button id="dashBtn" type="button">冲</button>
    </div>
  </div>
  <script src="js/rooms.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
